<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">사다리 타기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <!-- Language switcher -->
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="ko">한국어</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="zh">中文</button>
    <button class="lang-btn" data-lang="ja">日本語</button>
  </div>

  <div class="page">

    <!-- SETUP -->
    <div id="setup">
      <header class="hero">
        <div class="hero-icon">🪜</div>
        <h1 data-i18n="title">사다리 타기</h1>
        <p class="hero-sub" data-i18n="subtitle">참가자와 결과를 입력하고 운명의 사다리를 타보세요</p>
      </header>

      <div class="card setup-card">
        <div class="columns">
          <div class="col">
            <div class="col-header">
              <span class="col-icon">👤</span>
              <h2 data-i18n="players">참가자</h2>
              <span class="count-badge" id="player-count">1</span>
            </div>
            <div id="players-input" class="input-list">
              <div class="input-row">
                <span class="row-num">1</span>
                <input type="text" class="player-input" data-i18n-placeholder="playerPlaceholder" placeholder="이름 입력" />
                <button class="remove-btn" onclick="removeRow(this,'player')">✕</button>
              </div>
            </div>
            <button class="add-btn" onclick="addPlayer()">
              <span class="add-icon">＋</span>
              <span data-i18n="addPlayer">참가자 추가</span>
            </button>
          </div>

          <div class="divider"></div>

          <div class="col">
            <div class="col-header">
              <span class="col-icon">🎁</span>
              <h2 data-i18n="results">결과</h2>
              <span class="count-badge result-badge" id="result-count">1</span>
            </div>
            <div id="results-input" class="input-list">
              <div class="input-row">
                <span class="row-num result-num">1</span>
                <input type="text" class="result-input" data-i18n-placeholder="resultPlaceholder" placeholder="결과 입력" />
                <button class="remove-btn" onclick="removeRow(this,'result')">✕</button>
              </div>
            </div>
            <button class="add-btn result-add" onclick="addResult()">
              <span class="add-icon">＋</span>
              <span data-i18n="addResult">결과 추가</span>
            </button>
          </div>
        </div>

        <button class="start-btn" onclick="startGame()">
          <span data-i18n="startBtn">사다리 생성하기</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>
    </div>

    <!-- GAME -->
    <div id="game" class="hidden">
      <header class="game-header">
        <div class="hero-icon small">🪜</div>
        <h1 data-i18n="title">사다리 타기</h1>
        <button class="ghost-btn" onclick="resetGame()" data-i18n="resetBtn">↩ 다시 설정</button>
      </header>

      <div class="card ladder-card">
        <p class="hint" data-i18n="hint">참가자 이름을 클릭하면 개별 결과를 확인할 수 있어요</p>
        <div class="ladder-wrapper">
          <div id="player-labels" class="labels top-labels"></div>
          <canvas id="ladder-canvas"></canvas>
          <div id="result-labels" class="labels bottom-labels"></div>
        </div>
      </div>

      <div class="game-actions">
        <button class="run-btn" onclick="runAll()" data-i18n="runAll">✨ 전체 결과 보기</button>
      </div>

      <div id="results-display" class="results-display hidden">
        <h3 class="results-title" data-i18n="finalResult">🏆 최종 결과</h3>
        <div id="results-list"></div>
      </div>

      <div class="disqus-section card">
        <h3 class="disqus-title" data-i18n="comments">💬 댓글</h3>
        <div id="disqus_thread"></div>
        <script>
          (function() {
            var d = document, s = d.createElement('script');
            s.src = 'https://productbuilder-efdkuvocpv.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
          })();
        </script>
        <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
      </div>
    </div>

  </div>

  <script defer src="main.js"></script>
</body>
</html>
